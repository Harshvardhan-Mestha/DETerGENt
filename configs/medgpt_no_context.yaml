exp_name: no_context_MedGPT
evaluate: false
pred:
    model: medgpt
    generate: false
    from_file: true
    path: no_ctxt.csv
    out_path: gen_pred_med_no_ctxt.csv

expl:
    model: medgpt
    generate: true
    from_file: false
    out_path: gen_expl_med_no_ctxt.csv
    no_ctxt: true

medgpt:
    model_args:
        cfg_path: configs/minigpt/default.yaml
        gpu_id: 0
        options: None
    prompt_args:
        temperature: 0.6
        top_p: 0.9
        mode: caption
